name: contracts

on:
  push:
  pull_request:

jobs:
  solidity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @lockedin-circle/contracts
      - run: npm test -w @lockedin-circle/contracts
      - run: npm run size -w @lockedin-circle/contracts
